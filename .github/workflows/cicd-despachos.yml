name: CI/CD Backend Despachos - Innovatech
on:
  push:
    branches:
      - main
    paths:
      - "back-Despachos_SpringBoot/**"
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push image to ECR
        run: |
          docker build -t 863069581230.dkr.ecr.us-east-1.amazonaws.com/innovatech-despachos:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push 863069581230.dkr.ecr.us-east-1.amazonaws.com/innovatech-despachos:latest

      - name: Deploy en EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 54.234.164.197
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 863069581230.dkr.ecr.us-east-1.amazonaws.com
            docker pull 863069581230.dkr.ecr.us-east-1.amazonaws.com/innovatech-despachos:latest
            docker stop despachos || true
            docker rm despachos || true
            docker run -d -p 8081:8081 --name despachos 863069581230.dkr.ecr.us-east-1.amazonaws.com/innovatech-despachos:latest
