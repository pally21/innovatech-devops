name: CI/CD Frontend - Innovatech

on:
  push:
    branches:
      - main
    paths:
      - "front_despacho/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front_despacho/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: front_despacho

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests
        working-directory: front_despacho

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 863069581230.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: innovatech-frontend
      ECS_CLUSTER: innovatech-cluster
      ECS_SERVICE: innovatech-frontend-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push image to ECR
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
                       ./front_despacho
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION
