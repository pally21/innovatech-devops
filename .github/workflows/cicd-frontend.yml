name: CI/CD Frontend - Innovatech

on:
  push:
    branches:
      - deploy
    paths:
      - "front_despacho/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t pauly2026/innovatech-frontend:latest ./front_despacho
          docker push pauly2026/innovatech-frontend:latest
