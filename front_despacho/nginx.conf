server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Necesario para React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend Ventas
    location /api/ventas/ {
        proxy_pass http://10.0.2.49:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy al backend Despachos
    location /api/despachos/ {
        proxy_pass http://10.0.2.49:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
